[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "verdog-cli"
version = "0.1.1"
description = "The Verdog command-line client."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["verdog-runtime>=0.1.3,<0.2", "packaging>=23.2", "tabulate>=0.10", "ty==0.0.72"]

[project.scripts]
verdog = "verdog_cli.main:main"

[project.urls]
Repository = "https://github.com/verdog-ai/verdog-cli"
Documentation = "https://drexlerd.github.io/verdog-website/"

[dependency-groups]
dev = [
    "pytest",
    "pyright==1.1.411",
    "types-tabulate",
    "ruff==0.16.9",
    "pylint==4.0.9",
    "radon==6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["verdog_cli*"]

[tool.setuptools.package-data]
verdog_cli = ["py.typed"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "TID252", "D"]
ignore = ["UP040", "UP046", "UP047"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Test names and assertions document the behavior; helpers need no public API docs.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
