name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv
          uv pip install . --group dev
      - name: Check version matches tag
        run: |
          uv run --no-sync python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Tag must match project version {version}")
          PYTHON
      - name: Check style, types, and tests
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
          uv run --no-sync pytest
      - name: Build distributions
        run: uv build
      - name: Check installed wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -I -c 'from verdog_cli.main import main; from verdog_runtime.interpreter import Dispatcher; import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("verdog", "pyverdog", "verdog_compiler", "verdog_core"))'
          .venv/bin/python -I -m verdog_cli.main --help
          .venv/bin/verdog --help
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'verdog-ai/verdog-cli'
    environment:
      name: pypi
      url: https://pypi.org/project/verdog-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
